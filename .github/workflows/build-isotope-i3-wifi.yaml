name: 'Build Isotope i3 Wi-Fi ISO'

on:
  workflow_dispatch:
    inputs:
      isotope_version:
        description: 'Isotope release tag to build on'
        required: false
        default: 'v0.0.16'
        type: string
  pull_request:
    paths:
      - 'nodes/isotope-i3-wifi/**'
      - '.github/workflows/build-isotope-i3-wifi.yaml'

permissions:
  contents: read

jobs:
  iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout Isotope (for its ISO build script and theme)
        uses: actions/checkout@v6
        with:
          repository: kairos-community/isotope
          ref: ${{ inputs.isotope_version || 'v0.0.16' }}
          path: isotope

      # The image copy, the squashfs and the ISO each take several GB, more than
      # a stock runner has free. Same cleanup Isotope's own release build does.
      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/local/lib/android /usr/share/dotnet
          docker system prune --all --force
          df -h /

      - name: Build the image
        run: |
          v="${{ inputs.isotope_version || 'v0.0.16' }}"
          docker build \
            --build-arg BASE_IMAGE="ghcr.io/kairos-community/isotope:i3-${v}" \
            -t isotope-i3-wifi:dev nodes/isotope-i3-wifi

      - name: Check the firmware is in the image
        run: |
          docker run --rm --entrypoint ls isotope-i3-wifi:dev \
            /usr/lib/firmware/brcm/bcm43xx-0.fw.zst /usr/lib/firmware/brcm/bcm43xx_hdr-0.fw.zst

      - name: Build the ISO
        working-directory: isotope
        run: |
          df -h /
          auroraboot/build.sh isotope-i3-wifi:dev build/iso-out || { df -h /; exit 1; }

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: isotope-i3-wifi-iso
          path: isotope/build/iso-out/*.iso
          retention-days: 14
