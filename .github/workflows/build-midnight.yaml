name: 'Build Midnight image'

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - 'nodes/midnight/Dockerfile'
      - 'nodes/midnight/cloud-config.yaml'
      - '.github/workflows/build-midnight.yaml'
  pull_request:
    paths:
      - 'nodes/midnight/Dockerfile'
      - 'nodes/midnight/cloud-config.yaml'
      - '.github/workflows/build-midnight.yaml'

permissions:
  contents: write
  security-events: write
  id-token: write
  actions: read
  packages: write
jobs:
  midnight-base:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Determine version
        id: version
        run: |
          VERSION="$(git describe --tags --always --match 'midnight-v*' | sed 's/^midnight-//')"
          if [[ "$VERSION" =~ ^[a-f0-9]+$ ]]; then
            VERSION="v0.0.0-$VERSION"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          file: nodes/midnight/Dockerfile
          tags: quay.io/mauromorales/midnight:base-${{ github.sha }}
          labels: "quay.expires-after=2d"
          push: true
  midnight:
    name: Kairos Factory
    needs: midnight-base
    uses: kairos-io/kairos-factory-action/.github/workflows/reusable-factory.yaml@e2108928941a741b690e3f879f46e5f0706ae565 # v1.4.5
    secrets:
      registry_username: ${{ secrets.REGISTRY_USERNAME }}
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}
    with:
      base_image: quay.io/mauromorales/midnight:base-${{ github.sha }}
      model: "generic"
      arch: "amd64"
      version: ${{ needs.midnight-base.outputs.version }}
      iso: true
      grype: true
      security_scan_mode: "report-only"
      registry_domain: "quay.io"
      registry_namespace: "mauromorales"
      registry_repository: "midnight"
      summary_artifacts: true
      custom_tag_format: "$VERSION"
      custom_artifact_format: "midnight-$VERSION-$ARCH-$COMMIT_SHA"
      custom_job_name_format: "midnight"
      cloud_config: nodes/midnight/cloud-config.yaml
      image_labels: "quay.expires-after=2d"
