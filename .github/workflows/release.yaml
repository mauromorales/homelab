name: 'Build Homelab images'

on:
  push:
    tags:
      # Scoped per node, so each OS versions and releases independently
      # (mission-control#352). A bare v* tag no longer triggers anything --
      # full cutover, not a fallback.
      - 'kairos-v*'
      - 'protos-v*'
      - 'thuroros-v*'
      - 'noos-v*'

permissions:
  contents: write
  security-events: write
  id-token: write
  actions: read
  # v1.4.5's factory build job requests packages: write for the image push
  # step (v1.2.0, the old pin, did not). Without it here, GITHUB_TOKEN gets
  # capped to packages:none and the run is rejected before any job starts.
  # See mission-control#339/#340.
  packages: write
# NOTE: only thuroros is currently released. kairos, protos and noos are on
# hold (`false &&` prefixed onto each job's tag-scoped `if:`) until they have
# been tested; remove the `false && ` prefix from both the -base job and the
# factory job to bring a node back into the release. See the status table in
# README. Pushing e.g. `kairos-v1.0.0` cuts that node's release; the other
# nodes' jobs skip, their `if:` never matches a different node's tag prefix.
jobs:
  kairos-base:
    if: false && startsWith(github.ref_name, 'kairos-v')  # on hold: remove "false && " to re-enable
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Determine version
        id: version
        run: echo "value=${GITHUB_REF_NAME#kairos-}" >> "$GITHUB_OUTPUT"
      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          file: nodes/kairos/Dockerfile
          tags: quay.io/mauromorales/kairos:base-${{ github.sha }}
          push: true
  protos-base:
    if: false && startsWith(github.ref_name, 'protos-v')  # on hold: remove "false && " to re-enable
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Determine version
        id: version
        run: echo "value=${GITHUB_REF_NAME#protos-}" >> "$GITHUB_OUTPUT"
      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          file: nodes/protos/Dockerfile
          tags: quay.io/mauromorales/protos:base-${{ github.sha }}
          push: true
  thuroros-base:
    if: startsWith(github.ref_name, 'thuroros-v')
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Determine version
        id: version
        run: echo "value=${GITHUB_REF_NAME#thuroros-}" >> "$GITHUB_OUTPUT"
      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          file: nodes/thuroros/Dockerfile
          tags: quay.io/mauromorales/thuroros:base-${{ github.sha }}
          push: true
  noos-base:
    if: false && startsWith(github.ref_name, 'noos-v')  # on hold: remove "false && " to re-enable
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Determine version
        id: version
        run: echo "value=${GITHUB_REF_NAME#noos-}" >> "$GITHUB_OUTPUT"
      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          file: nodes/noos/Dockerfile
          tags: quay.io/mauromorales/noos:base-${{ github.sha }}
          push: true

  kairos:
    if: false && startsWith(github.ref_name, 'kairos-v')  # on hold: remove "false && " to re-enable
    name: Kairos Factory
    needs: kairos-base
    uses: kairos-io/kairos-factory-action/.github/workflows/reusable-factory.yaml@4d04258586b75aaf037047b668e2ff400f965bcf # v1.2.0
    secrets:
      registry_username: ${{ secrets.REGISTRY_USERNAME }}
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}
    with:
      base_image: quay.io/mauromorales/kairos:base-${{ github.sha }}
      model: "generic"
      arch: "amd64"
      version: ${{ needs.kairos-base.outputs.version }}
      iso: true
      grype: true
      security_scan_mode: "report-only"
      registry_domain: "quay.io"
      registry_namespace: "mauromorales"
      registry_repository: "kairos"
      summary_artifacts: true
      kubernetes_distro: "k0s"
      kubernetes_version: "v1.33.3+k0s.0"
      custom_tag_format: "$KAIROS_VERSION"
      custom_artifact_format: "kairos-$KAIROS_VERSION-$ARCH-$COMMIT_SHA"
      custom_job_name_format: "kairos"
      release: false
  protos:
    if: false && startsWith(github.ref_name, 'protos-v')  # on hold: remove "false && " to re-enable
    name: Kairos Factory
    needs: protos-base
    uses: kairos-io/kairos-factory-action/.github/workflows/reusable-factory.yaml@4d04258586b75aaf037047b668e2ff400f965bcf # v1.2.0
    secrets:
      registry_username: ${{ secrets.REGISTRY_USERNAME }}
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}
    with:
      base_image: quay.io/mauromorales/protos:base-${{ github.sha }}
      model: "generic"
      arch: "amd64"
      version: ${{ needs.protos-base.outputs.version }}
      iso: true
      grype: true
      security_scan_mode: "report-only"
      registry_domain: "quay.io"
      registry_namespace: "mauromorales"
      registry_repository: "protos"
      summary_artifacts: true
      kubernetes_distro: "k0s"
      kubernetes_version: "v1.33.3+k0s.0"
      custom_tag_format: "$VERSION"
      custom_artifact_format: "protos-$VERSION-$ARCH-$COMMIT_SHA"
      custom_job_name_format: "protos"
      cloud_config: nodes/protos/cloud-config.yaml
      release: true
  thuroros:
    if: startsWith(github.ref_name, 'thuroros-v')
    name: Kairos Factory
    needs: thuroros-base
    uses: kairos-io/kairos-factory-action/.github/workflows/reusable-factory.yaml@e2108928941a741b690e3f879f46e5f0706ae565 # v1.4.5
    secrets:
      registry_username: ${{ secrets.REGISTRY_USERNAME }}
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}
    with:
      dockerfile_path: nodes/thuroros/kairos.Dockerfile
      base_image: quay.io/mauromorales/thuroros:base-${{ github.sha }}
      model: "rpi4"
      arch: "arm64"
      version: ${{ needs.thuroros-base.outputs.version }}
      raw: true
      grype: true
      # thuroros's SBOM exceeds BuildKit's fixed 40 MiB attestation limit.
      # See mission-control#123/#339/#340. Real cost: no attached bill of
      # materials on the published image, until it's shrunk or published
      # as a separate (uncapped) artifact instead.
      sbom: false
      security_scan_mode: "report-only"
      registry_domain: "quay.io"
      registry_namespace: "mauromorales"
      registry_repository: "thuroros"
      summary_artifacts: true
      custom_tag_format: "$VERSION"
      custom_artifact_format: "thuroros-$VERSION-$ARCH-$COMMIT_SHA"
      custom_job_name_format: "thuroros"
      cloud_config: nodes/thuroros/cloud-config.yaml
      release: true
  noos:
    if: false && startsWith(github.ref_name, 'noos-v')  # on hold: remove "false && " to re-enable
    name: Kairos Factory
    needs: noos-base
    uses: kairos-io/kairos-factory-action/.github/workflows/reusable-factory.yaml@4d04258586b75aaf037047b668e2ff400f965bcf # v1.2.0
    secrets:
      registry_username: ${{ secrets.REGISTRY_USERNAME }}
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}
    with:
      base_image: quay.io/mauromorales/noos:base-${{ github.sha }}
      model: "generic"
      arch: "amd64"
      version: ${{ needs.noos-base.outputs.version }}
      iso: true
      grype: true
      security_scan_mode: "report-only"
      registry_domain: "quay.io"
      registry_namespace: "mauromorales"
      registry_repository: "noos"
      summary_artifacts: true
      kubernetes_distro: "k0s"
      kubernetes_version: "v1.33.3+k0s.0"
      custom_tag_format: "$VERSION"
      custom_artifact_format: "noos-$VERSION-$ARCH-$COMMIT_SHA"
      custom_job_name_format: "noos"
      release: true
