name: 'Build Kairos riscv64 VisionFive 2 image'

# Builds nodes/kairos-riscv64-vf2/kairos.Dockerfile under QEMU. Pushes to quay.io
# only from main; pull requests just validate the build. The HDMI image
# (Dockerfile.hdmi) needs a kernel built by hand and is not built here.
on:
  push:
    branches:
      - 'main'
    paths:
      - 'nodes/kairos-riscv64-vf2/**'
      - '.github/workflows/build-kairos-riscv64-vf2.yaml'
  pull_request:
    paths:
      - 'nodes/kairos-riscv64-vf2/**'
      - '.github/workflows/build-kairos-riscv64-vf2.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Login to Quay
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/riscv64
          file: nodes/kairos-riscv64-vf2/kairos.Dockerfile
          context: nodes/kairos-riscv64-vf2
          tags: |
            quay.io/mauromorales/kairos-riscv64-vf2:v4.4.0
            quay.io/mauromorales/kairos-riscv64-vf2:v4.4.0-${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
