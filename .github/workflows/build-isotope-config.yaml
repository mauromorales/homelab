name: 'Build Isotope config image'

on:
  workflow_dispatch:
    inputs:
      isotope_version:
        description: 'Isotope release tag to build on'
        required: false
        default: 'v0.0.22'
        type: string
      flavor:
        description: 'Isotope flavor (sway, i3, cosmic, niri)'
        required: false
        default: 'sway'
        type: string
      label:
        description: 'What this build changes; the tag is <flavor>-<release>-<label>'
        required: false
        default: 'config'
        type: string
  pull_request:
    paths:
      - 'nodes/isotope-config/**'
      - '.github/workflows/build-isotope-config.yaml'

permissions:
  contents: read

env:
  IMAGE_REPO: quay.io/mauromorales/isotope
  VERSION: ${{ inputs.isotope_version || 'v0.0.22' }}
  FLAVOR: ${{ inputs.flavor || 'sway' }}
  LABEL: ${{ inputs.label || 'config' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check the inputs
        run: |
          case "$FLAVOR" in sway|i3|cosmic|niri) ;; *) echo "unknown flavor $FLAVOR"; exit 1 ;; esac
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad release $VERSION"; exit 1; }
          echo "$LABEL" | grep -Eq '^[a-z0-9][a-z0-9.-]*$' || { echo "bad label $LABEL"; exit 1; }
          echo "TAG=${FLAVOR}-${VERSION}-${LABEL}" >> "$GITHUB_ENV"

      # A tag names one image for good: a machine that was tested on it must
      # find the same image under that name later.
      - name: Refuse a tag that exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          if docker manifest inspect "${IMAGE_REPO}:${TAG}" >/dev/null 2>&1; then
            echo "${IMAGE_REPO}:${TAG} exists. Choose another label."
            exit 1
          fi

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/local/lib/android /usr/share/dotnet
          docker system prune --all --force
          df -h /

      - name: Build the image
        run: |
          docker build \
            --build-arg BASE_IMAGE="ghcr.io/kairos-community/isotope:${FLAVOR}-${VERSION}" \
            -t isotope-config:dev nodes/isotope-config

      - name: Check the command, the guard and the unit are in the image
        run: |
          docker run --rm --entrypoint sh isotope-config:dev -c '
            isotope config help >/dev/null &&
            test -f /system/oem/07_isotope_config_guard.yaml &&
            test -L /etc/systemd/system/multi-user.target.wants/isotope-config-commit.service'

      - name: Login to Quay
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Push the image
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker tag isotope-config:dev "${IMAGE_REPO}:${TAG}"
          docker push "${IMAGE_REPO}:${TAG}"
          echo "Pushed ${IMAGE_REPO}:${TAG}" >> "$GITHUB_STEP_SUMMARY"
