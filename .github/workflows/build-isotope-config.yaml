name: 'Build Isotope config image'

on:
  workflow_dispatch:
    inputs:
      isotope_version:
        description: 'Isotope release tag to build on'
        required: false
        default: 'v0.0.22'
        type: string
      flavor:
        description: 'Isotope flavor (sway, i3, cosmic, niri)'
        required: false
        default: 'sway'
        type: string
      label:
        description: 'What this build changes; the tag is <flavor>-<release>-<label>'
        required: false
        default: 'config'
        type: string
  pull_request:
    paths:
      - 'nodes/isotope-config/**'
      - '.github/workflows/build-isotope-config.yaml'

permissions:
  contents: read

# One run at a time for a tag: two runs must not both find the tag free.
concurrency:
  group: isotope-config-${{ inputs.flavor || 'sway' }}-${{ inputs.isotope_version || 'v0.0.22' }}-${{ inputs.label || 'config' }}
  cancel-in-progress: false

env:
  IMAGE_REPO: quay.io/mauromorales/isotope
  VERSION: ${{ inputs.isotope_version || 'v0.0.22' }}
  FLAVOR: ${{ inputs.flavor || 'sway' }}
  LABEL: ${{ inputs.label || 'config' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check the inputs
        shell: bash
        # Whole-string matches: a value with a second line must not pass and
        # then write its own lines into GITHUB_ENV.
        run: |
          case "$FLAVOR" in sway|i3|cosmic|niri) ;; *) echo "unknown flavor"; exit 1 ;; esac
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad release"; exit 1; }
          [[ "$LABEL" =~ ^[a-z0-9][a-z0-9.-]{0,40}$ ]] || { echo "bad label"; exit 1; }
          echo "TAG=${FLAVOR}-${VERSION}-${LABEL}" >> "$GITHUB_ENV"

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/local/lib/android /usr/share/dotnet
          docker system prune --all --force
          df -h /

      - name: Build the image
        run: |
          docker build \
            --build-arg BASE_IMAGE="ghcr.io/kairos-community/isotope:${FLAVOR}-${VERSION}" \
            -t isotope-config:dev nodes/isotope-config

      - name: Check the command, the guard and the unit are in the image
        run: |
          docker run --rm --entrypoint sh isotope-config:dev -c '
            isotope config help >/dev/null &&
            test -f /system/oem/07_isotope_config_guard.yaml &&
            test -L /etc/systemd/system/multi-user.target.wants/isotope-config-commit.service'

      - name: Login to Quay
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # A tag names one image for good: a machine that was tested on it must
      # find the same image under that name later. Only the registry's own
      # "no such manifest" means the tag is free; any other failure (network,
      # auth, rate limit) stops the run and nothing is pushed.
      - name: Refuse a tag that exists
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if out=$(docker manifest inspect "${IMAGE_REPO}:${TAG}" 2>&1); then
            echo "${IMAGE_REPO}:${TAG} exists. Choose another label."
            exit 1
          fi
          if ! grep -Eqi 'manifest unknown|no such manifest|not found' <<<"$out"; then
            echo "Could not tell whether ${IMAGE_REPO}:${TAG} exists:"
            echo "$out"
            exit 1
          fi

      - name: Push the image
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker tag isotope-config:dev "${IMAGE_REPO}:${TAG}"
          docker push "${IMAGE_REPO}:${TAG}"
          echo "Pushed ${IMAGE_REPO}:${TAG}" >> "$GITHUB_STEP_SUMMARY"
