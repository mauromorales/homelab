name: 'Build Isotope i3 tray test image'

on:
  workflow_dispatch:
    inputs:
      isotope_version:
        description: 'Isotope release the image is built on'
        required: false
        default: 'v0.0.17'
        type: string
      label:
        description: 'What differs, used in the tag: <release>-<label>'
        required: false
        default: 'tray'
        type: string
  pull_request:
    paths:
      - 'nodes/isotope-i3-tray/**'
      - '.github/workflows/build-isotope-i3-tray.yaml'

permissions:
  contents: read

env:
  IMAGE_REPO: quay.io/mauromorales/isotope
  # Base is v0.0.17 because the v0.0.18 image is not published yet; the two differ
  # only by a Hadron bump, so update/ is the same. Pinned: the tray fix (branch isotope-strip-ansi-tray-v0.0.18 on the
  # mauro-agent fork) and Isotope main, for the Flatpak launcher.
  TRAY_REPO: mauro-agent/isotope
  TRAY_SHA: 36865443a950ca2e586638ecb365faf9aaa7f9f7
  MAIN_SHA: a7fcdcbc0a5e6775aafe0ab8e7fb0e7b4c683633

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout the tray fix
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TRAY_REPO }}
          ref: ${{ env.TRAY_SHA }}
          path: tray-src

      - name: Checkout Isotope main (for the Flatpak launcher)
        uses: actions/checkout@v6
        with:
          repository: kairos-community/isotope
          ref: ${{ env.MAIN_SHA }}
          path: main-src

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Choose the tag, and refuse one that exists
        run: |
          tag="${{ inputs.isotope_version || 'v0.0.17' }}-${{ inputs.label || 'tray' }}"
          if docker manifest inspect "${IMAGE_REPO}:${tag}" >/dev/null 2>&1; then
            echo "::error::${IMAGE_REPO}:${tag} already exists; pick another label"
            exit 1
          fi
          echo "TAG=${tag}" >> "$GITHUB_ENV"

      - name: Build the image
        run: |
          cp -r tray-src/update nodes/isotope-i3-tray/update
          cp main-src/rootfs-i3/usr/bin/start-desktop nodes/isotope-i3-tray/start-desktop
          docker build \
            --build-arg BASE_IMAGE="ghcr.io/kairos-community/isotope:i3-${{ inputs.isotope_version || 'v0.0.17' }}" \
            -t isotope-i3-tray:dev nodes/isotope-i3-tray

      - name: Check the launcher fix is in the image
        run: |
          docker run --rm --entrypoint grep isotope-i3-tray:dev -c "flatpak override" /usr/bin/start-desktop

      - name: Push the image
        run: |
          docker tag isotope-i3-tray:dev "${IMAGE_REPO}:${TAG}"
          docker push "${IMAGE_REPO}:${TAG}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE_REPO}:${TAG}")
          {
            echo "Pushed \`${IMAGE_REPO}:${TAG}\`"
            echo
            echo "Digest: \`${digest}\`"
            echo
            echo "Upgrade: \`isotope upgrade --image ${IMAGE_REPO}:${TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
