name: 'Build Kairos rpi5 image'

# Validates the OS-layer build (base + kairos-init) on push/PR, and builds
# + optionally publishes a raw disk image on workflow_dispatch. No
# factory-action here, the same reason kairos-riscv64 has none: kairos-init
# has no rpi5 model, so there's nothing for the factory's reusable workflow
# to build against.
#
# RAW, NOT ISO. An ISO is a CD/USB installer medium -- Raspberry Pi boards
# boot by reading a raw disk image's boot partition directly off the SD
# card, the same way every other Kairos RPi model ships (rpi3/rpi4) and
# every third-party RPi image does. First cut of this workflow shipped an
# ISO (kairos-riscv64's mechanism); Mauro caught that it made no sense for
# this hardware. Uses AuroraBoot's `--set disk.efi=true` raw-disk path
# instead (pkg/ops/rawDiskGeneration.go), the same one kairos-riscv64's
# ISO-only approach never touches -- confirmed against AuroraBoot's own
# e2e test (e2e/disks_test.go) rather than guessed.
#
# WHAT'S STILL UNVERIFIED, STATED PLAINLY IN THE RELEASE NOTES BELOW: the
# raw disk is the CORRECT ARTIFACT FORMAT for a Pi, but AuroraBoot's EFI
# raw-disk builder is generic -- it assumes standard UEFI firmware already
# on the board, which the Pi 5 does not have natively. Whether the EFI
# partition it produces actually chainloads through the Pi 5's own
# firmware/u-boot has not been confirmed on real hardware. See
# nodes/kairos-rpi5/README.md.
on:
  push:
    branches:
      - 'main'
    paths:
      - 'nodes/kairos-rpi5/**'
      - '.github/workflows/build-kairos-rpi5.yaml'
  pull_request:
    paths:
      - 'nodes/kairos-rpi5/**'
      - '.github/workflows/build-kairos-rpi5.yaml'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to publish as a GitHub Release (e.g. 0.1.0-alpha). Leave empty to just build without publishing.'
        required: false
        type: string

permissions:
  contents: write # only used when release_version is set, to create the GitHub Release
  actions: read

jobs:
  kairos-rpi5-base:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          file: nodes/kairos-rpi5/Dockerfile
          context: nodes/kairos-rpi5
          tags: quay.io/mauromorales/kairos-rpi5:base-${{ github.sha }}
          push: true

  build:
    runs-on: ubuntu-24.04-arm
    needs: kairos-rpi5-base
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.release_version }}" ]; then
            echo "value=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # A registry reference, not a locally --load'ed image: setup-buildx-action's
      # default docker-container driver runs an isolated BuildKit instance
      # that can't see the host docker daemon's image store, regardless of
      # architecture. Same reasoning kairos-riscv64 uses (mauromorales/homelab#43's
      # history, commit 7a34dde) -- riscv64 needs it because it has no
      # native GitHub-hosted runner and must cross-build under QEMU; this
      # node needs it for the driver-isolation reason alone, since it now
      # runs natively on ubuntu-24.04-arm.
      - name: Kairosify
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          file: nodes/kairos-rpi5/kairos.Dockerfile
          context: nodes/kairos-rpi5
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            BASE_IMAGE=quay.io/mauromorales/kairos-rpi5:base-${{ github.sha }}
          tags: kairos-rpi5:kairos
          load: true

      # quay.io/kairos/auroraboot:latest, not built from source: unlike
      # kairos-riscv64, arm64 is one of AuroraBoot's two factory-supported
      # architectures, so there's no known staleness in the released
      # container for this arch. If that assumption turns out wrong,
      # kairos-riscv64's build-from-source workaround is the fallback.
      #
      # `--set disk.efi=true` on the root command, not `build-iso`. This is
      # a completely different code path (deployer/steps.go's StepGenRawDisk,
      # pkg/ops/rawDiskGeneration.go) -- confirmed against AuroraBoot's own
      # e2e/disks_test.go, which uses exactly this flag shape. Our own
      # cloud-config.yaml is passed here (unlike kairos-riscv64's build-iso
      # call, which deliberately drops it): that decision was about an
      # `install:` stage build-iso needs for unattended install and this
      # cloud-config doesn't have, a constraint that doesn't apply to a raw
      # disk at all -- there's no install phase, the disk IS the installed
      # filesystem, so nothing is being smuggled past that reasoning here.
      #
      # The output filename isn't ours to predict: AuroraBoot derives it
      # from the built image's own /etc/kairos-release, not from a flag --
      # discovered by globbing for it rather than assumed.
      - name: Build raw disk
        id: build_raw
        run: |
          mkdir -p output
          # --privileged: raw disk generation writes partition images via
          # loop devices (mkfs onto a loop-mounted file). First run of this
          # step failed with "open /dev/loop-control: no such file or
          # directory" -- an unprivileged container has no loop-control
          # access at all, not just a missing --device mapping.
          docker run --rm --privileged \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/output:/tmp/auroraboot" \
            -v "$PWD/nodes/kairos-rpi5/cloud-config.yaml:/config.yaml:ro" \
            quay.io/kairos/auroraboot:latest \
            --debug \
            --set disable_http_server=true \
            --set disable_netboot=true \
            --set container_image=docker:kairos-rpi5:kairos \
            --set state_dir=/tmp/auroraboot \
            --set disk.efi=true \
            --cloud-config /config.yaml
          sudo chown -R "$(id -u):$(id -g)" output

          raw_path="$(find output -maxdepth 1 -name '*.raw' | head -n1)"
          if [ -z "$raw_path" ]; then
            echo "no .raw file produced by auroraboot" >&2
            ls -la output
            exit 1
          fi

          # Compress: a raw EFI+recovery disk exceeds GitHub's 2GB
          # per-asset limit uncompressed (first release attempt hit that
          # exact error). Also just the normal way an RPi image ships --
          # Raspberry Pi OS itself distributes .img.xz, not raw .img, and
          # raw disks compress hard since most of the space is sparse/zero.
          sudo apt-get update -qq && sudo apt-get install -y -qq xz-utils
          xz -T0 -6 "$raw_path"
          xz_path="${raw_path}.xz"
          sha256sum "$xz_path" > "$xz_path.sha256"
          echo "xz_path=$xz_path" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        if: ${{ inputs.release_version == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: kairos-rpi5-raw-xz-sha256
          path: ${{ steps.build_raw.outputs.xz_path }}.sha256
          retention-days: 7

      - name: Publish GitHub Release
        if: ${{ inputs.release_version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.release_version }}"
          prerelease_flag=()
          if [[ "$version" =~ (alpha|beta|rc) ]]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "kairos-rpi5-v${version}" \
            "${{ steps.build_raw.outputs.xz_path }}" \
            "${{ steps.build_raw.outputs.xz_path }}.sha256" \
            --title "Kairos rpi5 v${version}" \
            --notes "Experimental, unverified Kairos image for the Raspberry Pi 5, as a compressed raw disk (.raw.xz -- decompress, then flash with dd/Etcher/Raspberry Pi Imager, same as any RPi image) rather than an ISO. The EFI partition AuroraBoot produces assumes standard UEFI firmware, which the Pi 5 doesn't have natively -- whether it actually boots via the Pi 5's own firmware/u-boot chain has NOT been confirmed on real hardware. See nodes/kairos-rpi5/README.md for what's known versus open, and report back on kairos-io/kairos#2010 either way." \
            "${prerelease_flag[@]}"
