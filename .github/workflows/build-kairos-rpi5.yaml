name: 'Build KairOS rpi5 image'

# Validates the OS-layer build (base + kairos-init) on push/PR, and builds
# + optionally publishes an ISO on workflow_dispatch. No factory-action
# here, the same reason kairos-riscv64 has none: kairos-init has no rpi5
# model, so there's nothing for the factory's reusable workflow to build
# against.
#
# THE ISO IS AN UNTESTED GUESS ABOUT THE BOOT CHAIN, STATED PLAINLY IN THE
# RELEASE NOTES BELOW. auroraboot build-iso produces a UEFI-bootable ISO,
# the mechanism kairos-riscv64 uses -- whether the Pi 5's firmware/u-boot
# chain can actually boot that, versus needing a traditional RPi raw .img
# on an SD card, has not been verified on real hardware as of this
# workflow's writing. See nodes/kairos-rpi5/README.md.
on:
  push:
    branches:
      - 'main'
    paths:
      - 'nodes/kairos-rpi5/**'
      - '.github/workflows/build-kairos-rpi5.yaml'
  pull_request:
    paths:
      - 'nodes/kairos-rpi5/**'
      - '.github/workflows/build-kairos-rpi5.yaml'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to publish as a GitHub Release (e.g. 0.1.0-alpha). Leave empty to just build without publishing.'
        required: false
        type: string

permissions:
  contents: write # only used when release_version is set, to create the GitHub Release
  actions: read

jobs:
  kairos-rpi5-base:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          file: nodes/kairos-rpi5/Dockerfile
          context: nodes/kairos-rpi5
          tags: quay.io/mauromorales/kairos-rpi5:base-${{ github.sha }}
          push: true

  build:
    runs-on: ubuntu-24.04-arm
    needs: kairos-rpi5-base
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.release_version }}" ]; then
            echo "value=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # A registry reference, not a locally --load'ed image: setup-buildx-action's
      # default docker-container driver runs an isolated BuildKit instance
      # that can't see the host docker daemon's image store, regardless of
      # architecture. Same reasoning kairos-riscv64 uses (mauromorales/homelab#43's
      # history, commit 7a34dde) -- riscv64 needs it because it has no
      # native GitHub-hosted runner and must cross-build under QEMU; this
      # node needs it for the driver-isolation reason alone, since it now
      # runs natively on ubuntu-24.04-arm.
      - name: Kairosify
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          file: nodes/kairos-rpi5/kairos.Dockerfile
          context: nodes/kairos-rpi5
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            BASE_IMAGE=quay.io/mauromorales/kairos-rpi5:base-${{ github.sha }}
          tags: kairos-rpi5:kairos
          load: true

      # quay.io/kairos/auroraboot:latest, not built from source: unlike
      # kairos-riscv64, arm64 is one of AuroraBoot's two factory-supported
      # architectures, so there's no known staleness in the released
      # container for this arch. If that assumption turns out wrong,
      # kairos-riscv64's build-from-source workaround is the fallback.
      - name: Build ISO
        run: |
          mkdir -p output
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/output:/output" \
            quay.io/kairos/auroraboot:latest \
            --debug build-iso --arch arm64 --output /output \
            --override-name kairos-rpi5-ubuntu-${{ steps.version.outputs.value }} \
            docker:kairos-rpi5:kairos
          sudo chown -R "$(id -u):$(id -g)" output

      - name: Upload build artifact
        if: ${{ inputs.release_version == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: kairos-rpi5-ubuntu-iso-sha256
          path: output/kairos-rpi5-ubuntu-${{ steps.version.outputs.value }}.iso.sha256
          retention-days: 7

      - name: Publish GitHub Release
        if: ${{ inputs.release_version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.release_version }}"
          prerelease_flag=()
          if [[ "$version" =~ (alpha|beta|rc) ]]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "kairos-rpi5-v${version}" \
            output/kairos-rpi5-ubuntu-${{ steps.version.outputs.value }}.iso \
            output/kairos-rpi5-ubuntu-${{ steps.version.outputs.value }}.iso.sha256 \
            --title "KairOS rpi5 v${version}" \
            --notes "Experimental, unverified Kairos image for the Raspberry Pi 5. The boot chain (u-boot + RP1 firmware) has NOT been confirmed to work on real hardware -- this ISO is a guess at whether the Pi 5 can boot the same UEFI mechanism kairos-riscv64 uses. See nodes/kairos-rpi5/README.md for what's known versus open, and report back on kairos-io/kairos#2010 either way." \
            "${prerelease_flag[@]}"
