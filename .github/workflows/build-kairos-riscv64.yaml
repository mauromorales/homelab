name: 'Build Kairos riscv64 image'

# No kairos-factory-action here, unlike every other node's workflow: its
# reusable workflow hard-rejects any arch other than amd64/arm64
# (kairos-io/kairos-factory-action's reusable-factory.yaml errors "arch must
# be 'amd64' or 'arm64'"). This runs kairos-init and AuroraBoot directly
# instead. See nodes/kairos-riscv64/README.md for the full story, including
# why AuroraBoot is built from source rather than pulled as a container.
#
# Push/PR just validates the build. Publishing an ISO to a GitHub Release is
# a manual workflow_dispatch step, not tied to a tag push -- this node is
# experimental and the release should be a deliberate action, not automatic.
on:
  push:
    branches:
      - 'main'
    paths:
      - 'nodes/kairos-riscv64/**'
      - '.github/workflows/build-kairos-riscv64.yaml'
  pull_request:
    paths:
      - 'nodes/kairos-riscv64/**'
      - '.github/workflows/build-kairos-riscv64.yaml'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to publish as a GitHub Release (e.g. 0.1.0). Leave empty to just build without publishing.'
        required: false
        type: string

permissions:
  contents: write # only used when release_version is set, to create the GitHub Release
  actions: read

jobs:
  kairos-riscv64-base:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/riscv64
          file: nodes/kairos-riscv64/Dockerfile
          context: nodes/kairos-riscv64
          tags: quay.io/mauromorales/kairos-riscv64:base-${{ github.sha }}
          push: true

  build:
    runs-on: ubuntu-24.04
    needs: kairos-riscv64-base
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.release_version }}" ]; then
            echo "value=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # https://kairos.io/docs/reference/artifacts/'s convention:
      # kairos-<flavor_release>-<variant>-<arch>-<model>-<version>[-k3sv<k8s_version>].
      # variant is "standard" because this image bundles k3s (kairos-io/
      # kairos-factory-action's reusable-factory.yaml sets variant the same
      # way, off whether a kubernetes_distro was requested).
      #
      # No official k3s release exists for riscv64 yet, so there's no real
      # "+k3sN" build number to append -- KUBERNETES_VERSION here is the
      # upstream Kubernetes version the CARV-ICS-FORTH fork's binary actually
      # reports (https://github.com/CARV-ICS-FORTH/k3s/releases), not a k3s
      # release. Bump this together with kairos.Dockerfile's
      # K3S_RISCV64_RELEASE -- the two are paired, and neither file can read
      # the other's value.
      - name: Determine artifact name
        id: artifact
        env:
          KUBERNETES_VERSION: v1.36.3
        run: |
          echo "name=kairos-ubuntu-24.04-standard-riscv64-generic-${{ steps.version.outputs.value }}-k3sv${KUBERNETES_VERSION#v}" >> "$GITHUB_OUTPUT"

      # kairos.Dockerfile builds FROM the pushed base image
      # (kairos-riscv64-base, above), matching every other node's
      # base-then-factory split. A *locally* --load'ed image from an earlier
      # step doesn't work here, buildx's docker-container builder runs an
      # isolated BuildKit instance for this cross-build and can't see the
      # host docker daemon's image store (mauromorales/homelab#43's history:
      # commit 7a34dde hit exactly that). A registry reference is a
      # different thing entirely; this same file already pulls
      # quay.io/kairos/kairos-init that way, in this same job.
      - name: Kairosify
        uses: docker/build-push-action@v6
        with:
          platforms: linux/riscv64
          file: nodes/kairos-riscv64/kairos.Dockerfile
          context: nodes/kairos-riscv64
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            BASE_IMAGE=quay.io/mauromorales/kairos-riscv64:base-${{ github.sha }}
          tags: kairos-riscv64:kairos
          load: true

      # quay.io/kairos/auroraboot:latest is stale for riscv64 -- see the
      # README for why. Build from AuroraBoot's own main branch instead.
      #
      # TEMPORARY: pinned to a fork branch carrying the fix for
      # kairos-io/AuroraBoot#752 (raw disk generation hard-failed on riscv64
      # with "could not find any shim file to copy") to verify it in CI
      # before asking for it to be merged upstream. Revert this ref back to
      # kairos-io/AuroraBoot main once #752 lands.
      - name: Checkout AuroraBoot
        uses: actions/checkout@v6
        with:
          repository: mauro-agent/AuroraBoot
          ref: fix/riscv64-raw-efi-no-shim
          path: auroraboot-src

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: auroraboot-src/go.mod

      - name: Install AuroraBoot build + ISO dependencies
        run: |
          sudo apt-get update
          # mtools provides mcopy, which AuroraBoot shells out to when writing
          # the ISO's EFI System Partition (FAT). Missing here: "exec: \"mcopy\":
          # executable file not found in $PATH", https://github.com/mauromorales/homelab/actions/runs/32492388737/job/96802839319
          sudo apt-get install -y libpcsclite-dev squashfs-tools xorriso dosfstools mtools

      - name: Build AuroraBoot
        working-directory: auroraboot-src
        run: |
          # internal/ui embeds the compiled React frontend via `go:embed
          # all:dist`; the CLI-only build this workflow needs doesn't build
          # that frontend, so a placeholder file is enough to satisfy embed.
          mkdir -p internal/ui/dist
          touch internal/ui/dist/.gitkeep
          go build -ldflags "-X main.version=v0.0.0-riscv64-node" -o ../auroraboot .

      - name: Build ISO
        run: |
          mkdir -p output
          # sudo: dumping the source image's rootfs sets file ownership that
          # an unprivileged process can't Lchown.
          sudo ./auroraboot --debug build-iso --arch riscv64 --output ./output/ \
            --override-name ${{ steps.artifact.outputs.name }} \
            docker:kairos-riscv64:kairos
          sudo chown -R "$(id -u):$(id -g)" output

      # Same auroraboot binary as the ISO step, but through its top-level
      # --set config mode instead of the build-iso subcommand -- build-iso
      # only ever emits an ISO, and this repeats the config shape
      # kairos-factory-action's own RAW step uses (see reusable-factory.yaml),
      # just running the binary directly instead of through its container.
      #
      # state_dir is its OWN directory (./output-raw), never ./output --
      # mission-control#421's sibling bug, homelab#53: two AuroraBoot builds
      # sharing one output/scratch directory has silently corrupted output
      # before (no error logged, output just quietly wrong), and
      # kairos-riscv64-v0.1.2's ISO stopped booting the one release this ran
      # into the ISO step's own ./output. Not proven down to the exact byte,
      # but it is the only structural difference between that release and
      # the one before it that booted fine, and isolating the two is correct
      # regardless. The finished, named .raw file still lands in ./output
      # below, so every step after this one is unchanged.
      - name: Generate RAW artifact
        id: raw
        run: |
          mkdir -p output output-raw
          sudo ./auroraboot --debug \
            --set "disable_http_server=true" \
            --set "disable_netboot=true" \
            --set "container_image=docker:kairos-riscv64:kairos" \
            --set "state_dir=./output-raw" \
            --set "disk.raw=true" \
            --set "arch=riscv64"
          sudo chown -R "$(id -u):$(id -g)" output-raw
          # AuroraBoot's --set mode has no --override-name equivalent for a
          # raw disk (that flag is build-iso-only), so the file it emits
          # gets renamed here to match the ISO's naming -- this is the name
          # a tester actually sees after `docker cp` extracts it, so it has
          # to carry the same k3s/version information the ISO does.
          raw_file=$(ls output-raw/*.raw | head -1)
          mv "$raw_file" "output/${{ steps.artifact.outputs.name }}.raw"
          raw_file="output/${{ steps.artifact.outputs.name }}.raw"
          sha256sum "$raw_file" | tee "${raw_file}.sha256"
          echo "path=$raw_file" >> "$GITHUB_OUTPUT"

      # The raw image routinely runs past GitHub's 2 GiB release-asset limit,
      # so it isn't attached to the release like the ISO is. It's published
      # as a scratch OCI artifact on Quay instead (the same shape
      # kairos-factory-action uses for every other node's raw builds), and
      # pulled back out with `docker create` + `docker cp` -- see the
      # extraction notes this workflow appends to the release below, and
      # nodes/kairos-riscv64/README.md.
      #
      # Gated to release_version like the release itself, unlike the base
      # image push above: that one is a required input to the next build
      # step (mauromorales/homelab#43), this one is pure distribution, and a
      # multi-GB push on every push/PR validation run would be pure waste.
      - name: Push RAW artifact to Quay
        if: ${{ inputs.release_version != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nodes/kairos-riscv64/Dockerfile.img
          platforms: linux/riscv64
          push: true
          tags: quay.io/mauromorales/kairos-riscv64:${{ steps.version.outputs.value }}-img
          build-args: |
            ARTIFACT=${{ steps.raw.outputs.path }}

      - name: Upload build artifact
        if: ${{ inputs.release_version == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: kairos-riscv64-iso-sha256
          path: output/${{ steps.artifact.outputs.name }}.iso.sha256
          retention-days: 7

      - name: Publish GitHub Release
        if: ${{ inputs.release_version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.release_version }}"
          tag="kairos-riscv64-v${version}"
          img_ref="quay.io/mauromorales/kairos-riscv64:${version}-img"
          raw_sha256="$(cut -d' ' -f1 output/*.raw.sha256)"

          # --prerelease is a semver signal, not an "is this experimental"
          # one -- this node's own README already tells testers it's
          # experimental. Only alpha/beta/rc-suffixed versions get flagged;
          # a plain x.y.z becomes the repo's Latest release like any other.
          prerelease_flag=()
          if [[ "$version" =~ (alpha|beta|rc) ]]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "$tag" \
            output/${{ steps.artifact.outputs.name }}.iso \
            output/${{ steps.artifact.outputs.name }}.iso.sha256 \
            --title "Kairos riscv64 v${version}" \
            --notes "Experimental riscv64 Kairos image. See nodes/kairos-riscv64/README.md for what this is and how to test it." \
            "${prerelease_flag[@]}"

          # Raw image isn't attached above -- see the "Push RAW artifact to
          # Quay" step. Append how to get it back out.
          {
            printf '%s\n\n' "$(gh release view "$tag" --json body -q .body)"
            printf '## Raw disk image\n\n'
            printf 'A raw disk image is also published, for flashing straight to hardware without going through the ISO installer. It exceeds GitHub'"'"'s 2 GiB release-asset limit, so it is not attached here -- it is published as an OCI artifact on Quay instead:\n\n'
            printf '`%s`\n\n' "$img_ref"
            printf 'Extract it with Docker:\n\n'
            printf '```bash\n'
            printf 'export IMAGE=%s\n' "$img_ref"
            printf 'container=$(docker create "$IMAGE" noop)   # scratch image: throwaway command, never executed\n'
            printf 'docker cp "$container:/output/." .\n'
            printf 'docker rm "$container"\n'
            printf '```\n\n'
            printf 'The `.raw` file is now in the current directory, ready to flash (`dd`, Balena Etcher, etc). SHA256: `%s`\n' "$raw_sha256"
          } | gh release edit "$tag" --notes-file -
