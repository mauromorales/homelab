name: 'Build ThurorOS image'

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - 'nodes/thuroros/Dockerfile'
      - 'nodes/thuroros/kairos.Dockerfile'
      - 'nodes/thuroros/cloud-config.yaml'
      - '.github/workflows/build-thuroros.yaml'
  pull_request:
    paths:
      - 'nodes/thuroros/Dockerfile'
      - 'nodes/thuroros/kairos.Dockerfile'
      - 'nodes/thuroros/cloud-config.yaml'
      - '.github/workflows/build-thuroros.yaml'

permissions:
  contents: write
  security-events: write
  id-token: write
  actions: read
  # v1.4.5's factory build job requests packages: write for the image push
  # step (v1.2.0, this workflow's previous pin, did not). Without it here,
  # GITHUB_TOKEN gets capped to packages:none regardless of what the reusable
  # workflow itself declares, and the run is rejected before any job starts.
  packages: write
jobs:
  thuroros-base:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          file: nodes/thuroros/Dockerfile
          tags: quay.io/mauromorales/thuroros:base-${{ github.sha }}
          labels: "quay.expires-after=2d"
          push: true
  thuroros:
    name: Kairos Factory
    needs: thuroros-base
    uses: kairos-io/kairos-factory-action/.github/workflows/reusable-factory.yaml@e2108928941a741b690e3f879f46e5f0706ae565 # v1.4.5
    secrets:
      registry_username: ${{ secrets.REGISTRY_USERNAME }}
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}
    with:
      dockerfile_path: nodes/thuroros/kairos.Dockerfile
      base_image: quay.io/mauromorales/thuroros:base-${{ github.sha }}
      model: "rpi4"
      arch: "arm64"
      version: "auto"
      raw: true
      grype: true
      # BuildKit refuses any single attestation over 40 MiB and fails the whole
      # push; thuroros's SBOM crosses that line (mission-control#123, #339).
      # The image itself is unaffected, this only drops the attached bill of
      # materials. v1.2.0, this workflow's previous pin, hardcoded sbom: true
      # with no way to turn it off, hence the version bump alongside this.
      sbom: false
      security_scan_mode: "report-only"
      registry_domain: "quay.io"
      registry_namespace: "mauromorales"
      registry_repository: "thuroros"
      summary_artifacts: true
      custom_tag_format: "$VERSION"
      custom_artifact_format: "thuroros-$VERSION-$ARCH-$COMMIT_SHA"
      custom_job_name_format: "thuroros"
      cloud_config: nodes/thuroros/cloud-config.yaml
      image_labels: "quay.expires-after=2d"
