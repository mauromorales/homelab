version: 2
updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"

  # Docker dependencies for thuroros node
  - package-ecosystem: "docker"
    directory: "/nodes/thuroros"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # This image is named Kairos Ubuntu 22.04 rpi4: stay on Ubuntu 22.04.
    # Only patch updates of the same release come through.
    ignore:
      - dependency-name: "ubuntu"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
