#cloud-config

hostname: "hegemon"

install:
  auto: true
  reboot: true
  device: auto
  grub_options:
    default_menu_entry: "Hegemon"

users:
  - name: "mauro"
    groups: ["admin"]
    ssh_authorized_keys:
      - github:mauromorales

k0s:
  enabled: true
  args:
    - --enable-worker
    - --no-taints

stages:
  initramfs:
    - name: "Trust fleet.home.arpa's certificate"
      files:
        # Public cert only, self-signed today. Re-issuing this from an
        # internal CA later is a content swap in this same file -- no change
        # to how it's trusted. Same cert already trusted by thuroros
        # (nodes/thuroros/cloud-config.yaml), reused verbatim here.
        - path: /usr/local/share/ca-certificates/fleet.home.arpa.crt
          permissions: 0644
          owner: 0
          group: 0
          content: |
            -----BEGIN CERTIFICATE-----
            MIIDMTCCAhmgAwIBAgIUOIrQDxfxWCgsNzr1d1Liw8tUPVcwDQYJKoZIhvcNAQEL
