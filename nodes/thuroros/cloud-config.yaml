    - name: "Configure a static IP for eth0"
      files:
        # Matches the DHCP reservation already bound to this Pi's MAC on the
        # Deco mesh. This is a second, independent guarantee of the same
        # address, not a change to it -- if the two ever disagree, that is
        # worth noticing, not something this file should paper over.
        - path: /etc/netplan/99-thuroros-static.yaml
          permissions: 0600
          owner: 0
          group: 0
          content: |
            network:
              version: 2
              renderer: networkd
              ethernets:
                eth0:
                  dhcp4: false
                  addresses:
                    - 192.168.68.51/22
                  routes:
                    - to: default
                      via: 192.168.68.1
                  nameservers:
                    addresses:
                      - 192.168.68.59
                      - 1.1.1.1
      commands:
        - netplan apply
