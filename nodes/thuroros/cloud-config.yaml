#cloud-config

# The stages that used to live here (doorbell, doorbell-web, cert-trust) moved
# to nodes/thuroros/system-oem/*.yaml, baked into /system/oem at build time
# instead of landing on COS_OEM here (mission-control#541). COS_OEM only gets
# written at install/reflash time -- kairos-agent upgrade never touches it
# (mission-control#532) -- so anything that needs to survive an upgrade
# belongs in a system-oem/ fragment, not here. This file is for what's
# genuinely install-time/per-instance: hostname and users.

hostname: "thuroros"

users:
  - name: "mauro"
    groups: ["admin"]
    ssh_authorized_keys:
      - github:mauromorales
