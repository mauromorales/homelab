name: "thuroros: trust fleet.home.arpa's certificate"
stages:
  initramfs:
    - name: "Trust fleet.home.arpa's certificate"
      files:
        # Public cert only, self-signed today (mauromorales/mission-control#405).
        # Re-issuing this from an internal CA later is a content swap in this
        # same file -- no change to how it's trusted.
        #
        # Regenerated 2026-08-28 with a proper SAN (mauromorales/mission-control#482):
        # the original had none, which Go's crypto/tls -- kairos-agent's TLS
        # stack -- has refused to work around since Go 1.15, so registration
        # against fleet.home.arpa failed even though this cert was already
        # trusted. curl and OpenSSL still fall back to the CN field, which is
        # why this looked fine from every tool except the one that mattered.
        #
        # Moved here from cloud-config.yaml (mission-control#541): that file
        # lands on COS_OEM, which only gets written at install/reflash time --
        # kairos-agent upgrade never touches it (mission-control#532), so a
        # cert rotation could never reach an already-installed node. This
        # fragment lives on /system/oem instead, baked into the image itself,
        # so it refreshes on every upgrade like the rest of the OS.
        - path: /usr/local/share/ca-certificates/fleet.home.arpa.crt
          permissions: 0644
          owner: 0
          group: 0
          content: |
            -----BEGIN CERTIFICATE-----
            MIIDMTCCAhmgAwIBAgIUOIrQDxfxWCgsNzr1d1Liw8tUPVcwDQYJKoZIhvcNAQEL
