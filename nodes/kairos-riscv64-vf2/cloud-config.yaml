#cloud-config

hostname: "kairos-vf2"

users:
  - name: kairos
    groups: ["admin"]
    # Replace with your own public key. There is no default password on purpose.
    ssh_authorized_keys:
      - "ssh-ed25519 AAAA... you@example"

k3s:
  enabled: true
  args:
    - --write-kubeconfig-mode=644
    - --disable=traefik
    # The root filesystem is an overlay; containerd's overlayfs snapshotter
    # cannot stack on it. See ../kairos-riscv64/README.md.
    - --snapshotter=native

# Trust the fleet console, same as the other nodes. Without it the
# phone-home registration fails TLS verification. Public certificates only.
# The registration token is NOT here: it is a secret, see README.md (Fleet).
stages:
  initramfs:
    - name: "Trust the fleet console's certificate"
      files:
        # Public cert only: the fleet console's own certificate. It also needs a
        # SAN: Go's crypto/tls (kairos-agent) rejects a cert with only a CN.
