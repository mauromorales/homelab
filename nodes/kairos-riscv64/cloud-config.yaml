#cloud-config

hostname: "kairos-riscv64"

users:
  - name: "mauro"
    groups: ["admin"]
    ssh_authorized_keys:
      - github:mauromorales

# The k3s.service unit itself comes from kairos.Dockerfile's install step
# (get.k3s.io, run at build time), same as any other Kairos k3s node. This
# just configures and starts it: provider-kairos's k3s stanza writes a
# systemd override (ExecStart) onto that unit, it doesn't create one.
k3s:
  enabled: true
  args:
    - --write-kubeconfig-mode=644
    - --disable=traefik
    # Kairos's root filesystem is itself an overlay; containerd's default
    # overlayfs snapshotter can't stack overlay-on-overlay and fails to
    # mount. This is a general overlay-root-filesystem issue, not
    # riscv64-specific, and the same class of problem k0s's own riscv64 CI
    # hit and worked around by avoiding overlay mounts.
    - --snapshotter=native
