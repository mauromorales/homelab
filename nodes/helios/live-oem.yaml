name: "helios live system"

# Applies only on a live boot, where /run/cos/live_mode exists (or the UKI installer marker).
# Recovery boots use a different marker, and an installed system has neither, so neither
# is touched.
#
# Goal: a live system of this image has no open login. Whoever boots it brings their own
# user, with a cloud-config at boot (for example the config of an ISO). This image ships no
# user and no key.
# - Kairos sets the default password (kairos) for the kairos user in the initramfs stage,
#   and it opens the same user on tty1/ttyS0 with a root autologin. yip does not order files
#   by name across the directory, so the steps here run in initramfs.after, which starts
#   after every initramfs step. The kairos user is locked, and the autologin overrides go.
# - A getty on a serial port (ttyS4, the AMT Serial-over-LAN port of some workstations).
# - The Kairos web installer on port 8080 is switched off in /etc/kairos/agent.yaml (see the
#   Dockerfile). Left on, any host on the LAN could install to a disk with its own config.
stages:
  initramfs.after:
    - name: "Lock the default login and remove the root autologin on a live system"
      if: '[ -f /run/cos/live_mode ] || [ -f /run/cos/uki_install_mode ]'
      users:
        kairos:
          passwd: "!"
      commands:
        - rm -f /etc/systemd/system/getty@tty1.service.d/override.conf /etc/systemd/system/serial-getty@ttyS0.service.d/override.conf
        - ln -sf /usr/lib/systemd/system/serial-getty@.service /etc/systemd/system/getty.target.wants/serial-getty@ttyS4.service
  network:
    - name: "Lock the default login again once the network is up"
      if: '[ -f /run/cos/live_mode ] || [ -f /run/cos/uki_install_mode ]'
      users:
        kairos:
          passwd: "!"
