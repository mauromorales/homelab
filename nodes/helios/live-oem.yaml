name: "helios live system"

# Applies only on a live (netboot) boot, where /run/cos/live_mode exists. Recovery boots
# use a different marker, and an installed system has neither, so neither is touched.
#
# - The default kairos user gets a random password nobody knows. Kairos sets the known
#   default password in the initramfs stage, so this step also runs there (file order
#   puts this file after it). Without this, any client that netboots the image gets a
#   login with a known password.
# - The install user mauro gets the owner's public SSH keys and no password, so only
#   a key opens it. It is created in the network stage because a top-level users:
#   block in a config_url file is not applied at boot on a netboot live system.
# - A login on the AMT Serial-over-LAN port (ttyS4).
stages:
  initramfs:
    - name: "Replace the default login password on a live system"
      if: '[ -f /run/cos/live_mode ]'
      users:
        kairos:
          passwd: "$6$96x/st3LeD14H21Y$F/D7Z1P8zapqI/lu44IeIpbK5ztM.NiIIFfzPFiUePXNp/eZgwxz/pzvoxIc7u5JB7Df5OIz.choLNNzjI42n0"
    - name: "Console login on the AMT Serial-over-LAN port of a live system"
      if: '[ -f /run/cos/live_mode ]'
      commands:
        - ln -sf /usr/lib/systemd/system/serial-getty@.service /etc/systemd/system/getty.target.wants/serial-getty@ttyS4.service
  network:
    - name: "Create the install user on a live system"
      if: '[ -f /run/cos/live_mode ]'
      users:
        kairos:
          passwd: "$6$96x/st3LeD14H21Y$F/D7Z1P8zapqI/lu44IeIpbK5ztM.NiIIFfzPFiUePXNp/eZgwxz/pzvoxIc7u5JB7Df5OIz.choLNNzjI42n0"
        mauro:
          passwd: "!"
          groups: ["admin"]
          shell: /bin/bash
          ssh_authorized_keys:
            - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEErFJCppTAvi6tBtefN2uawWwFrLhgO3kfA8zZGygA1"
            - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKeztC/ulgeqqeRNE3yEpGwGLDHZGVsxXJ4qr4kK4oxu"
            - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE9pKtr6sEe+NmmEM941CW1vJ+V69DGWz+CpJn++bRtC"
            - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMlncHX7JExB8bgIUG59T/9YHuypHSbuV8A/qNS1RxWE"
            - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOG3waxPIieQPfa+iTVQ2WLZsO8oRnbPx6NIUecK3LoU"
